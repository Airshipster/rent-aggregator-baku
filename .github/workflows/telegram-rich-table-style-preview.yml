name: telegram-rich-table-style-preview

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "bina.az listing id"
        required: true
        default: "6307925"

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      LISTING_ID: ${{ inputs.listing_id }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.3
      - name: Send table style previews
        run: |
          python - <<'PY'
          import os
          import time

          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_OWNER_CHAT_ID"]
          listing_id = os.environ["LISTING_ID"].strip()

          query = """
          query ItemDetail($id:ID!){
            item(id:$id){
              id
              path
              address
              description
              rooms
              floor
              floors
              hasRepair
              longitude
              latitude
              location{fullName path}
              nearestLocations{... on Location{id fullName path} ... on City{id name path}}
              area{value units}
              price{total currency perAre}
              company{id name targetType}
              business{... on Agency{id name path itemsCount viewsCount contactAddress latitude longitude city{name}} ... on Residence{id companyName path address lat lng city{name}}}
              category{id name pluralName slug title}
              photos{full f660x496 thumbnail}
            }
          }
          """
          response = requests.post(
              "https://bina.az/graphql",
              json={"query": query, "variables": {"id": listing_id}},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          if payload.get("errors"):
              raise RuntimeError(payload["errors"])
          item = payload["data"]["item"]
          if not item:
              raise RuntimeError(f"Listing {listing_id} not found")

          photos = [
              p.get("full") or p.get("f660x496") or p.get("thumbnail")
              for p in item.get("photos") or []
          ]
          photos = [p for p in photos if p]
          media = [
              {"id": f"p{index + 1}", "media": {"type": "photo", "media": url}}
              for index, url in enumerate(photos[:12])
          ]

          category = item.get("category") or {}
          location = item.get("location") or {}
          area = item.get("area") or {}
          price = item.get("price") or {}
          landmarks = []
          if location.get("fullName"):
              landmarks.append(location["fullName"].strip())
          for node in item.get("nearestLocations") or []:
              value = node.get("fullName") or node.get("name")
              if value and value.strip() not in landmarks:
                  landmarks.append(value.strip())

          rooms = item.get("rooms")
          title = " · ".join(
              part
              for part in [
                  f"{rooms} otaqlı" if rooms else "",
                  category.get("name") or "Mənzil",
                  location.get("fullName") or "",
              ]
              if part
          )
          params = " · ".join(
              part
              for part in [
                  f"{rooms} otaq" if rooms else "",
                  f"{area.get('value'):g} m²" if area.get("value") is not None else "",
                  f"{item.get('floor') or '?'}/{item.get('floors') or '?'}" if item.get("floor") or item.get("floors") else "",
                  "təmirli" if item.get("hasRepair") is True else "təmirsiz" if item.get("hasRepair") is False else "",
              ]
              if part
          )
          price_text = f"{price.get('total')} {price.get('currency') or 'AZN'} / ay" if price.get("total") is not None else "Qiymət göstərilməyib"
          listing_url = f"https://bina.az{item['path']}"
          lat = item.get("latitude")
          lon = item.get("longitude")
          maps_url = f"https://www.google.com/maps?q={lat},{lon}" if lat and lon else ""
          landlord = "#agentlik" if item.get("business") or ((item.get("company") or {}).get("targetType") == "AGENCY") else "#mülkiyyətçi"
          address = item.get("address") or "Ünvan dəqiqləşdirilir"
          info = (item.get("description") or "Məlumat əlavə edilməyib").strip()
          if len(info) > 1000:
              info = info[:997] + "..."

          rows = [
              ("Qiymət", price_text),
              ("Ünvan", address),
              ("Yaxınlıqda", " · ".join(landmarks[:4]) or "Yaxın obyektlər qeyd olunmayıb"),
              ("Parametrlər", params or "Ətraflı məlumat elanda"),
              ("Kirayə verən", landlord),
              ("Məlumat", info),
          ]

          count = len(media)
          first_count = (count + 1) // 2

          def photo_block(index):
              return {"type": "photo", "photo": {"type": "photo", "media": photos[index]}}

          def collage_blocks():
              blocks = []
              if count:
                  blocks.append({
                      "type": "collage",
                      "blocks": [photo_block(i) for i in range(0, first_count)],
                  })
              if count > first_count:
                  blocks.append({
                      "type": "collage",
                      "blocks": [photo_block(i) for i in range(first_count, count)],
                  })
              return blocks

          def table_block(is_bordered=False, is_striped=False):
              block = {
                  "type": "table",
                  "cells": [
                      [
                          {"text": label, "is_header": True, "align": "right", "valign": "middle"},
                          {"text": value, "align": "left", "valign": "middle"},
                      ]
                      for label, value in rows
                  ],
              }
              if is_bordered:
                  block["is_bordered"] = True
              if is_striped:
                  block["is_striped"] = True
              return block

          def horizontal_blocks():
              blocks = []
              for index, (label, value) in enumerate(rows):
                  blocks.append({
                      "type": "table",
                      "cells": [[
                          {"text": label, "is_header": True, "align": "right", "valign": "middle"},
                          {"text": value, "align": "left", "valign": "middle"},
                      ]],
                  })
                  if index != len(rows) - 1:
                      blocks.append({"type": "divider"})
              return blocks

          def map_details_block():
              if not maps_url:
                  return None
              return {
                  "type": "details",
                  "summary": "Xəritə",
                  "blocks": [
                      {"type": "paragraph", "text": {"type": "url", "text": "Google Xəritə", "url": maps_url}},
                      {
                          "type": "map",
                          "location": {"latitude": lat, "longitude": lon},
                          "zoom": 15,
                          "width": 600,
                          "height": 300,
                          "caption": {"text": address},
                      },
                  ],
              }

          variants = [
              ("Variant C2: bordered official", [table_block(is_bordered=True)]),
              ("Variant D2: striped official", [table_block(is_striped=True)]),
              ("Variant E2: bordered + striped official", [table_block(is_bordered=True, is_striped=True)]),
              ("Variant F2: horizontal imitasiya", horizontal_blocks()),
          ]

          def rich_blocks(label, table_blocks):
              blocks = [
                  {"type": "heading", "text": label, "size": 3},
                  {"type": "heading", "text": title, "size": 3},
                  *table_blocks,
                  {"type": "paragraph", "text": f"Foto: {count} / {len(photos)}"},
                  *collage_blocks(),
              ]
              details = map_details_block()
              if details:
                  blocks.append(details)
              return blocks

          for label, table_blocks in variants:
              result = requests.post(
                  f"https://api.telegram.org/bot{token}/sendRichMessage",
                  json={
                      "chat_id": chat_id,
                      "rich_message": {"blocks": rich_blocks(label, table_blocks)},
                      "disable_notification": True,
                      "reply_markup": {
                          "inline_keyboard": [[{"text": "Ətraflı bax", "url": listing_url}]]
                      },
                  },
                  timeout=90,
              )
              print(label, result.status_code)
              print(result.text[:1000])
              result.raise_for_status()
              data = result.json()
              if not data.get("ok"):
                  raise RuntimeError(data)
              time.sleep(1)

          print(f"sent table style previews for {listing_id}: photos={len(photos)} media={len(media)} split={first_count}+{count - first_count}")
          PY
