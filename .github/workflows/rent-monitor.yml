name: rent-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: rent-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USER_ID: ${{ secrets.TELEGRAM_OWNER_USER_ID }}
      TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
      TELEGRAM_STATE_CHAT_ID: ${{ secrets.TELEGRAM_STATE_CHAT_ID }}
      APPROVED_USER_IDS: ${{ secrets.APPROVED_USER_IDS }}
      APPROVED_USER_IDS_2: ${{ secrets.APPROVED_USER_IDS_2 }}
      APPROVED_USER_IDS_3: ${{ secrets.APPROVED_USER_IDS_3 }}
      APPROVED_USER_IDS_4: ${{ secrets.APPROVED_USER_IDS_4 }}
      APPROVED_USER_IDS_5: ${{ secrets.APPROVED_USER_IDS_5 }}
      PRIVATE_BACKFILL_USER_IDS: ${{ secrets.PRIVATE_BACKFILL_USER_IDS }}
      SOURCE_START_URL: ${{ secrets.SOURCE_START_URL }}
      SOURCE_GRAPHQL_PATH: ${{ secrets.SOURCE_GRAPHQL_PATH }}
      CENTRAL_INGEST_URL: ${{ secrets.CENTRAL_INGEST_URL }}
      CENTRAL_INGEST_SHARED_SECRET: ${{ secrets.CENTRAL_INGEST_SHARED_SECRET }}
      ENABLE_PUBLIC_CHANNEL: ${{ vars.ENABLE_PUBLIC_CHANNEL || 'false' }}
      ENABLE_PRIVATE_FULL: ${{ vars.ENABLE_PRIVATE_FULL || 'true' }}
      PUBLIC_LANGUAGE: ${{ vars.PUBLIC_LANGUAGE || 'az' }}
      PRIVATE_LANGUAGE: ${{ vars.PRIVATE_LANGUAGE || 'ru' }}
      MAX_LISTINGS_PER_RUN: ${{ vars.MAX_LISTINGS_PER_RUN || '20' }}
      LIST_PAGES_PER_RUN: ${{ vars.LIST_PAGES_PER_RUN || '1' }}
      MAX_DETAIL_FETCHES_PER_RUN: ${{ vars.MAX_DETAIL_FETCHES_PER_RUN || '10' }}
      COLLECTOR_CITY_BATCH_SIZE: ${{ vars.COLLECTOR_CITY_BATCH_SIZE || '5' }}
      MAX_IMAGES_PRIVATE: ${{ vars.MAX_IMAGES_PRIVATE || '50' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
      USE_PLAYWRIGHT: "false"
      REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '20' }}
      PROTECT_PRIVATE_CONTENT: ${{ vars.PROTECT_PRIVATE_CONTENT || 'true' }}
      MAX_NEW_AGE_HOURS: ${{ vars.MAX_NEW_AGE_HOURS || '24' }}
      MAX_PRIVATE_AGE_HOURS: ${{ vars.MAX_PRIVATE_AGE_HOURS || '24' }}
      MAX_PUBLIC_AGE_HOURS: ${{ vars.MAX_PUBLIC_AGE_HOURS || '168' }}
      UPDATE_SCAN_HOURS: ${{ vars.UPDATE_SCAN_HOURS || '168' }}
      UPDATE_CHECK_INTERVAL_MINUTES: ${{ vars.UPDATE_CHECK_INTERVAL_MINUTES || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.main
      - name: commit fallback state
        if: ${{ always() && !env.CENTRAL_INGEST_URL }}
        run: |
          if [ -n "$(git status --porcelain state/last_seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/last_seen.json
            git commit -m "Update monitor state"
            git push
      - name: commit central collector state
        if: ${{ success() && env.CENTRAL_INGEST_URL }}
        run: |
          if [ -n "$(git status --porcelain state/central_collector.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/central_collector.json
            git commit -m "Update central collector state"
            git push
          fi
