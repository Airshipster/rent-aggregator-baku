name: telegram-preview

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "bina.az listing id"
        required: true
        default: "6307925"

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      LISTING_ID: ${{ inputs.listing_id }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.3
      - name: Send preview
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import textwrap

          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_OWNER_CHAT_ID"]
          listing_id = os.environ["LISTING_ID"].strip()

          query = """
          query ItemDetail($id:ID!){
            item(id:$id){
              id
              path
              address
              description
              rooms
              floor
              floors
              hasRepair
              contactName
              contactTypeName
              buildingTypeName
              longitude
              latitude
              updatedAt
              location{fullName path}
              nearestLocations{... on Location{id fullName path} ... on City{id name path}}
              area{value units}
              price{total currency perAre}
              company{id name targetType}
              business{... on Agency{id name path itemsCount viewsCount contactAddress latitude longitude city{name}} ... on Residence{id companyName path address lat lng city{name}}}
              category{id name pluralName slug title}
              city{id name path slug}
              photos{full f660x496 thumbnail}
            }
          }
          """

          response = requests.post(
              "https://bina.az/graphql",
              json={"query": query, "variables": {"id": listing_id}},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          if payload.get("errors"):
              raise RuntimeError(payload["errors"])
          item = payload["data"]["item"]
          if not item:
              raise RuntimeError(f"Listing {listing_id} not found")

          def esc(value):
              return html.escape(str(value or ""), quote=False)

          area = item.get("area") or {}
          price = item.get("price") or {}
          category = item.get("category") or {}
          loc = item.get("location") or {}
          landmarks = []
          if loc.get("fullName"):
              landmarks.append(loc["fullName"].strip())
          for node in item.get("nearestLocations") or []:
              value = node.get("fullName") or node.get("name")
              if value and value.strip() not in landmarks:
                  landmarks.append(value.strip())

          rooms = item.get("rooms")
          title_parts = []
          if rooms:
              title_parts.append(f"{rooms} otaqlı")
          title_parts.append(category.get("name") or "Mənzil")
          if loc.get("fullName"):
              title_parts.append(loc["fullName"])
          title = " · ".join(title_parts)

          floor = ""
          if item.get("floor") or item.get("floors"):
              floor = f"{item.get('floor') or '?'} / {item.get('floors') or '?'}"
          repair = "təmirli" if item.get("hasRepair") is True else "təmirsiz" if item.get("hasRepair") is False else "təmir qeyd olunmayıb"
          seller_type = "agentlik" if item.get("business") or ((item.get("company") or {}).get("targetType") == "AGENCY") else "mülkiyyətçi"
          listing_url = f"https://bina.az{item['path']}"
          latitude = item.get("latitude")
          longitude = item.get("longitude")
          map_url = f"https://www.google.com/maps?q={latitude},{longitude}" if latitude and longitude else ""
          photos = [p.get("full") or p.get("f660x496") or p.get("thumbnail") for p in item.get("photos") or []]
          photos = [url for url in photos if url]

          specs = " · ".join(part for part in [
              f"{area.get('value'):g} m²" if area.get("value") is not None else "",
              floor,
              repair,
          ] if part)
          caption = "\n".join(line for line in [
              f"🏠 <b>{esc(title)}</b>",
              f"💰 <b>{esc(price.get('total'))} {esc(price.get('currency') or 'AZN')}</b> / ay" if price.get("total") is not None else "💰 Qiymət göstərilməyib",
              f"📍 {esc(' · '.join(landmarks[:4]) or item.get('address') or 'Lokasiya dəqiqləşdirilir')}",
              f"📐 {esc(specs)}" if specs else "",
              f"👤 #{seller_type}",
              "",
              f"🗺 {esc(map_url)}" if map_url else "",
              f"🔗 {esc(listing_url)}",
              "",
              f"Foto: {min(len(photos), 10)} / {len(photos)}",
          ] if line != "")
          if len(caption) > 1000:
              caption = caption[:997] + "..."

          api = f"https://api.telegram.org/bot{token}"
          if photos:
              media = []
              for index, url in enumerate(photos[:10]):
                  entry = {"type": "photo", "media": url}
                  if index == 0:
                      entry["caption"] = caption
                      entry["parse_mode"] = "HTML"
                  media.append(entry)
              result = requests.post(
                  f"{api}/sendMediaGroup",
                  data={"chat_id": chat_id, "media": json.dumps(media, ensure_ascii=False)},
                  timeout=60,
              )
              result.raise_for_status()
              data = result.json()
              if not data.get("ok"):
                  raise RuntimeError(data)
          else:
              result = requests.post(
                  f"{api}/sendMessage",
                  data={"chat_id": chat_id, "text": caption, "parse_mode": "HTML", "disable_web_page_preview": False},
                  timeout=30,
              )
              result.raise_for_status()
              data = result.json()
              if not data.get("ok"):
                  raise RuntimeError(data)

          if latitude and longitude:
              result = requests.post(
                  f"{api}/sendLocation",
                  data={"chat_id": chat_id, "latitude": latitude, "longitude": longitude},
                  timeout=30,
              )
              result.raise_for_status()
              data = result.json()
              if not data.get("ok"):
                  raise RuntimeError(data)

          print(f"sent preview for {listing_id}: photos={len(photos)}")
          PY
