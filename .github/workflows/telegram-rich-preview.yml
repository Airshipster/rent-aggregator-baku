name: telegram-rich-preview

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "bina.az listing id"
        required: true
        default: "6307925"

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      LISTING_ID: ${{ inputs.listing_id }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.3
      - name: Send rich preview
        run: |
          python - <<'PY'
          import html
          import os

          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_OWNER_CHAT_ID"]
          listing_id = os.environ["LISTING_ID"].strip()

          query = """
          query ItemDetail($id:ID!){
            item(id:$id){
              id
              path
              address
              description
              rooms
              floor
              floors
              hasRepair
              contactName
              contactTypeName
              buildingTypeName
              longitude
              latitude
              updatedAt
              location{fullName path}
              nearestLocations{... on Location{id fullName path} ... on City{id name path}}
              area{value units}
              price{total currency perAre}
              company{id name targetType}
              business{... on Agency{id name path itemsCount viewsCount contactAddress latitude longitude city{name}} ... on Residence{id companyName path address lat lng city{name}}}
              category{id name pluralName slug title}
              city{id name path slug}
              photos{full f660x496 thumbnail}
            }
          }
          """
          payload = requests.post(
              "https://bina.az/graphql",
              json={"query": query, "variables": {"id": listing_id}},
              timeout=30,
          ).json()
          if payload.get("errors"):
              raise RuntimeError(payload["errors"])
          item = payload["data"]["item"]
          if not item:
              raise RuntimeError(f"Listing {listing_id} not found")

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          photos = [
              p.get("full") or p.get("f660x496") or p.get("thumbnail")
              for p in item.get("photos") or []
          ]
          photos = [p for p in photos if p]
          category = item.get("category") or {}
          location = item.get("location") or {}
          area = item.get("area") or {}
          price = item.get("price") or {}
          landmarks = []
          if location.get("fullName"):
              landmarks.append(location["fullName"].strip())
          for node in item.get("nearestLocations") or []:
              value = node.get("fullName") or node.get("name")
              if value and value.strip() not in landmarks:
                  landmarks.append(value.strip())

          rooms = item.get("rooms")
          title = " · ".join(
              part
              for part in [
                  f"{rooms} otaqlı" if rooms else "",
                  category.get("name") or "Mənzil",
                  location.get("fullName") or "",
              ]
              if part
          )
          specs = " · ".join(
              part
              for part in [
                  f"{area.get('value'):g} m²" if area.get("value") is not None else "",
                  f"{item.get('floor') or '?'}/{item.get('floors') or '?'}" if item.get("floor") or item.get("floors") else "",
                  "təmirli" if item.get("hasRepair") is True else "təmirsiz" if item.get("hasRepair") is False else "",
              ]
              if part
          )
          price_text = f"{price.get('total')} {price.get('currency') or 'AZN'} / ay" if price.get("total") is not None else "Qiymət göstərilməyib"
          listing_url = f"https://bina.az{item['path']}"
          lat = item.get("latitude")
          lon = item.get("longitude")
          seller = "agentlik" if item.get("business") or ((item.get("company") or {}).get("targetType") == "AGENCY") else "mülkiyyətçi"

          collage_imgs = "\n".join(f'<img src="{esc(url)}"/>' for url in photos[:12])
          facts_table = f"""
          <table>
            <tr><th>Qiymət</th><td>{esc(price_text)}</td></tr>
            <tr><th>Yer</th><td>{esc(" · ".join(landmarks[:4]) or item.get("address") or "")}</td></tr>
            <tr><th>Parametrlər</th><td>{esc(specs)}</td></tr>
            <tr><th>Satıcı</th><td>#{esc(seller)}</td></tr>
          </table>
          """
          map_block = f'<figure><tg-map lat="{lat}" long="{lon}" zoom="15"/><figcaption>{esc(item.get("address") or "Xəritə")}</figcaption></figure>' if lat and lon else ""
          description = esc((item.get("description") or "").strip())
          if len(description) > 800:
              description = description[:797] + "..."

          rich_html = f"""
          <h3>{esc(title)}</h3>
          <tg-collage>
          {collage_imgs}
          <figcaption>Foto: {min(len(photos), 12)} / {len(photos)}</figcaption>
          </tg-collage>
          {facts_table}
          {map_block}
          <details><summary>Описание</summary><p>{description}</p></details>
          <p><a href="{esc(listing_url)}">Elana baxmaq</a></p>
          """

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendRichMessage",
              json={
                  "chat_id": chat_id,
                  "rich_message": {"html": rich_html},
                  "disable_notification": True,
              },
              timeout=60,
          )
          print(response.status_code)
          print(response.text[:1000])
          response.raise_for_status()
          data = response.json()
          if not data.get("ok"):
              raise RuntimeError(data)
          print(f"sent rich preview for {listing_id}: photos={len(photos)}")
          PY
