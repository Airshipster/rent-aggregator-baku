services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 768m
    environment:
      POSTGRES_DB: rent_aggregator
      POSTGRES_USER: rent_aggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent_aggregator -d rent_aggregator"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  app:
    image: ${RENT_IMAGE:-rent-aggregator-baku:local}
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rent_aggregator:${POSTGRES_PASSWORD}@postgres:5432/rent_aggregator
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 384m
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.rent-aggregator-baku-webhook.rule: "Host(`scitopus.com`) && Path(`/telegram-bots/rent-aggregator-baku/webhook`)"
      traefik.http.routers.rent-aggregator-baku-webhook.priority: "110"
      traefik.http.routers.rent-aggregator-baku-webhook.tls: "true"
      traefik.http.routers.rent-aggregator-baku-webhook.tls.certresolver: le
      traefik.http.routers.rent-aggregator-baku-webhook.service: rent-aggregator-baku
      traefik.http.routers.rent-aggregator-baku-ingest.rule: "Host(`scitopus.com`) && Path(`/telegram-bots/rent-aggregator-baku/v1/ingest/listings`)"
      traefik.http.routers.rent-aggregator-baku-ingest.priority: "110"
      traefik.http.routers.rent-aggregator-baku-ingest.tls: "true"
      traefik.http.routers.rent-aggregator-baku-ingest.tls.certresolver: le
      traefik.http.routers.rent-aggregator-baku-ingest.service: rent-aggregator-baku
      traefik.http.routers.rent-aggregator-baku-collector.rule: "Host(`scitopus.com`) && Path(`/telegram-bots/rent-aggregator-baku/v1/collector/status`)"
      traefik.http.routers.rent-aggregator-baku-collector.priority: "110"
      traefik.http.routers.rent-aggregator-baku-collector.tls: "true"
      traefik.http.routers.rent-aggregator-baku-collector.tls.certresolver: le
      traefik.http.routers.rent-aggregator-baku-collector.service: rent-aggregator-baku
      traefik.http.services.rent-aggregator-baku.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8080/healthz', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: uvicorn server.app:app --host 0.0.0.0 --port 8080
  channel-worker:
    image: ${RENT_IMAGE:-rent-aggregator-baku:local}
    healthcheck:
      test: ["CMD", "python", "-m", "server.healthcheck", "worker-channel"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rent_aggregator:${POSTGRES_PASSWORD}@postgres:5432/rent_aggregator
      WORKER_QUEUE: channel
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m server.worker
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    read_only: true
    tmpfs: ["/tmp:size=32m"]
  private-worker:
    image: ${RENT_IMAGE:-rent-aggregator-baku:local}
    healthcheck:
      test: ["CMD", "python", "-m", "server.healthcheck", "worker-private"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rent_aggregator:${POSTGRES_PASSWORD}@postgres:5432/rent_aggregator
      WORKER_QUEUE: private
    restart: unless-stopped
    cpus: 0.45
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m server.worker
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    read_only: true
    tmpfs: ["/tmp:size=32m"]
  collector:
    image: ${RENT_IMAGE:-rent-aggregator-baku:local}
    healthcheck:
      test: ["CMD", "python", "-m", "server.healthcheck", "collector"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rent_aggregator:${POSTGRES_PASSWORD}@postgres:5432/rent_aggregator
      SOURCE_START_URL: https://bina.az/kiraye
      COLLECTOR_INTERVAL_SECONDS: "120"
      MAX_LISTINGS_PER_RUN: "100"
      LIST_PAGES_PER_RUN: "2"
      MAX_DETAIL_FETCHES_PER_RUN: "100"
    command: python -m server.collector_service
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 256m
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
networks:
  traefik:
    external: true
